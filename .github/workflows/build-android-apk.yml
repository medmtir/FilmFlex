name: Build FilmFlex Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Verify and Prepare APK
        run: |
          mkdir -p android-apk
          cp android/app/build/outputs/apk/release/*.apk android-apk/FilmFlex.apk
          ls -lh android-apk/FilmFlex.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmFlex-Android-APK
          path: android-apk/FilmFlex.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "FilmFlex Android APK v1.0.3"
          prerelease: false
          generate_release_notes: true
          files: android-apk/FilmFlex.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
